<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- MARRAM's mark: a section through a skillion roof, which is the roof
       form on most of the houses in the portfolio. Drawn as strokes rather
       than a filled glyph so it stays legible at 16px in a browser tab. -->
  <rect width="32" height="32" fill="#11110f"/>
  <path d="M6 24V13l10-5 10 5v11" fill="none" stroke="#f0eee8" stroke-width="2.2"/>
  <path d="M6 24h20" stroke="#9d7148" stroke-width="2.2"/>
</svg>
